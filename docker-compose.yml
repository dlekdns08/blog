services:
  blog:
    build: .
    ports:
      - "3000:3000"
    environment:
      - CLAUDE_TOKEN=${CLAUDE_TOKEN}
      - ARXIV_DB_PATH=/root/.arxiv-graph/data/arxiv_graph.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - API_URL=${API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    volumes:
      - /root/.arxiv-graph/data:/root/.arxiv-graph/data:ro
      # 호스트의 content/ 를 그대로 마운트 — 이미지 재빌드 없이 새 글 즉시 반영.
      # 관리자 API(src/app/api/admin/posts)가 fs.writeFile 로 쓰기 때문에 rw 필요.
      - ./content:/app/content
    restart: always
